version: "3.9"

services:
  backend:
    build: ./backend
    container_name: li_mailbox_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data        # persist SQLite DB
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: li_mailbox_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000

volumes:
  data:
